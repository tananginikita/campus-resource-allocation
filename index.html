<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172554;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #ddd;
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .login-title {
            margin-bottom: 20px;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        .student {
            background: #2563eb;
        }

        .faculty {
            background: #16a34a;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .info {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }

        @media (max-width: 600px) {

            .login-container {
                padding: 25px;
            }

            .logo {
                font-size: 26px;
            }

            .login-button {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🏫 CampusConnect
        </div>

        <p class="subtitle">
            College Facility Resource Allocation System
        </p>

        <h2 class="login-title">
            Login As
        </h2>

        <a href="student.html"
           class="login-button student">
            👨‍🎓 Student
        </a>

        <a href="faculty.html"
           class="login-button faculty">
            👨‍🏫 Faculty / Admin
        </a>

        <p class="info">
            Find classrooms, labs and seminar halls
            and manage facility requests easily.
        </p>

    </div>

</body>
</html>
